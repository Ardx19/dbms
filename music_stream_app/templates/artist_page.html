{% extends "base.html" %}

{% block content %}
<div class="artist-page">
    <div class="artist-header">
        <a href="{{ url_for('artists') }}" class="back-button">
            <i class="fas fa-arrow-left"></i>
            Back to Artists
        </a>
        <h1>{{ artist.name }}</h1>
        <p class="artist-bio">{{ artist.bio }}</p>
        <div class="artist-stats">
            <span class="stat">
                <i class="fas fa-music"></i>
                {{ albums|length }} Albums
            </span>
            <span class="stat">
                <i class="fas fa-headphones"></i>
                {{ artist.total_streams or 0 }} Streams
            </span>
        </div>
    </div>

    <div class="albums-section">
        <h2>Albums</h2>
        <div class="albums-grid">
            {% for album in albums %}
            <div class="album-card" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="{{ loop.index * 100 }}">
                <div class="album-image">
                    <img src="{{ album.cover_url or 'https://via.placeholder.com/300' }}" 
                         alt="{{ album.title }}"
                         onerror="this.src='https://via.placeholder.com/300'">
                    <div class="album-overlay">
                        <div class="album-info">
                            <h3>{{ album.title }}</h3>
                            <p class="release-date">{{ album.release_date }}</p>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<style>
.artist-page {
    padding: 2rem;
    max-width: 1200px;
    margin: 0 auto;
}

.back-button {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: #666;
    text-decoration: none;
    margin-bottom: 2rem;
    transition: color 0.3s ease;
}

.back-button:hover {
    color: #333;
}

.artist-header {
    text-align: center;
    margin-bottom: 3rem;
}

.artist-header h1 {
    font-size: 3rem;
    margin-bottom: 1rem;
}

.artist-bio {
    font-size: 1.2rem;
    color: #666;
    max-width: 800px;
    margin: 0 auto 2rem;
}

.artist-stats {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-top: 1rem;
}

.stat {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: #666;
    font-size: 1.1rem;
}

.albums-section {
    margin-top: 3rem;
}

.albums-section h2 {
    font-size: 2rem;
    margin-bottom: 2rem;
    text-align: center;
}

.albums-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 2rem;
    padding: 1rem;
}

.album-card {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 0;
    transform: translateY(20px);
}

.album-card.visible {
    opacity: 1;
    transform: translateY(0);
}

.album-card:hover {
    transform: translateY(-10px) scale(1.02);
    box-shadow: 0 12px 20px rgba(0, 0, 0, 0.2);
}

.album-image {
    position: relative;
    width: 100%;
    padding-top: 100%;
    overflow: hidden;
    background: #f5f5f5;
}

.album-image img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.album-card:hover .album-image img {
    transform: scale(1.1);
}

.album-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%);
    opacity: 0;
    transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: flex-end;
    padding: 1.5rem;
}

.album-card:hover .album-overlay {
    opacity: 1;
}

.album-info {
    color: white;
    transform: translateY(20px);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.album-card:hover .album-info {
    transform: translateY(0);
}

.album-info h3 {
    margin: 0;
    font-size: 1.2rem;
    font-weight: 600;
}

.release-date {
    color: rgba(255,255,255,0.8);
    font-size: 0.9rem;
    margin-top: 0.5rem;
}

@media (max-width: 768px) {
    .artist-header h1 {
        font-size: 2.5rem;
    }
    
    .artist-stats {
        flex-direction: column;
        gap: 1rem;
    }
    
    .albums-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1.5rem;
    }
}
</style>

<script src="https://unpkg.com/aos@next/dist/aos.js"></script>
<script>
    AOS.init({
        once: true,
        offset: 100,
        duration: 800,
        easing: 'ease-out-cubic'
    });

    // Additional animation for album cards
    document.addEventListener('DOMContentLoaded', function() {
        const albumCards = document.querySelectorAll('.album-card');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, {
            threshold: 0.1
        });

        albumCards.forEach(card => {
            observer.observe(card);
        });
    });
</script>
{% endblock %}
