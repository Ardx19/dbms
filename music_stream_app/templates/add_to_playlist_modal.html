<!-- Add to Playlist Modal -->
<div class="modal fade" id="addToPlaylistModal{{ song.song_id }}" tabindex="-1" aria-labelledby="addToPlaylistModalLabel{{ song.song_id }}" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addToPlaylistModalLabel{{ song.song_id }}">Add to Playlist</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="list-group">
                    {% for playlist in playlists %}
                    <form action="{{ url_for('add_to_playlist', playlist_id=playlist.playlist_id, song_id=song.song_id) }}" method="POST" class="d-inline">
                        <button type="submit" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                            {{ playlist.playlist_name }}
                            <span class="badge bg-primary rounded-pill">{{ playlist.song_count }} songs</span>
                        </button>
                    </form>
                    {% endfor %}
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
