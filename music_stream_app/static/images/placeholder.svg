<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="300" height="300" fill="#121212"/>
    
    <!-- Music note icon -->
    <g transform="translate(100, 100)" fill="#1DB954">
        <!-- Note head -->
        <ellipse cx="50" cy="50" rx="30" ry="30"/>
        <!-- Note stem -->
        <rect x="75" y="0" width="10" height="100" rx="5"/>
        <!-- Note flag -->
        <path d="M85,0 Q105,20 85,40" stroke="#1DB954" stroke-width="8" fill="none"/>
    </g>
    
    <!-- Text -->
    <text x="150" y="250" font-family="Poppins, sans-serif" font-size="14" fill="#b3b3b3" text-anchor="middle">
        No image available
    </text>
</svg> 